name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-test:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest

  mcp-server-test:
    name: MCP server build + smoke tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills-mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: skills-mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (type-check)
        run: npm run build

      - name: Smoke tests
        run: npm run test:run

  frontend-lint-test:
    name: Frontend lint + unit tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

  rust-test:
    name: Rust tests (cargo test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [rust/skills-mcp, rust/creation_station_db]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.crate }}/target
          key: cargo-${{ runner.os }}-${{ matrix.crate }}-${{ hashFiles(format('{0}/Cargo.toml', matrix.crate)) }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.crate }}-

      - name: Run tests
        working-directory: ${{ matrix.crate }}
        run: cargo test --all-targets
