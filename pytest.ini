[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage gate on the product core. The floor is a ratchet pinned just below
# the current measured reach (~89%; 88 rounds down to stay robust across Python
# versions), not an aspirational target — raise it as coverage grows, never
# lower it to make a red build pass.
addopts = -v --tb=short --cov=core --cov-report=term-missing --cov-fail-under=88
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
